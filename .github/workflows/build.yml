name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download Assets
      run: |
        mkdir -p app/src/main/assets
        curl -L -o app/src/main/assets/bootstrap-aarch64.zip https://github.com/termux/termux-packages/releases/download/bootstrap-2024.10.24-r1/bootstrap-aarch64.zip
        curl -L -o app/src/main/assets/cs.pkg https://github.com/alice-bluearchive/android-vscode/releases/download/null/cs.pkg

    - run: chmod +x gradlew || true
    - run: gradle wrapper --gradle-version 8.7
    - run: ./gradlew assembleDebug
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Build ${{ github.run_number }}
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
